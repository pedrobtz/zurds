# The fixture matrix written by R itself (design section 14, roadmap
# Stage 1). On oldrel, release and devel, each job:
#   - regenerates the checked-in set and fails if its manifest no longer
#     matches the one in tests/testthat/fixtures (bar writer and SHA-256,
#     which change with the R version);
#   - writes the full matrix, every object in every format, version and
#     compression, and runs the suite against it.
on:
  push:
    branches: [main, master]
  pull_request:

name: fixtures

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    name: fixtures (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: [oldrel, release, devel]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr, local::.
      - name: The checked-in manifest matches its regeneration
        run: |
          Rscript tools/make-fixtures.R "$RUNNER_TEMP/small"
          Rscript -e '
            keep <- c("file", "kind", "object", "format", "version", "compression")
            a <- read.csv("tests/testthat/fixtures/manifest.csv")[keep]
            b <- read.csv(file.path(Sys.getenv("RUNNER_TEMP"), "small", "manifest.csv"))[keep]
            # zstd rows depend on how this R was built.
            a <- a[a$compression %in% b$compression, ]; rownames(a) <- NULL
            if (!identical(a, b)) { print(all.equal(a, b)); quit(status = 1) }
            cat("manifest matches\n")'
      - name: Write the full matrix and run the suite against it
        env:
          ZURDS_FIXTURES: ${{ runner.temp }}/full
        run: |
          Rscript tools/make-fixtures.R --full "$ZURDS_FIXTURES"
          Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
