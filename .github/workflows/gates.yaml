# Gates over the built package, each seen to fail on a planted defect before
# it is trusted (roadmap, rules for every stage).
#
#   symbols     the shared object exports R_init_zurds only, and references
#               no console-output or process-exit symbol (design section 13)
#   standalone  the walk builds with no R (-DZRD_STANDALONE) and walks every
#               uncompressed XDR fixture of the full matrix, and every prefix
#               of each, clean under ASan and UBSan (roadmap Stage 2)
#   fuzz canary the fuzz target runs every seed cleanly and crashes on its
#               planted input, so fuzz.yaml's clean runs mean something
#               (roadmap Stage 10)
on:
  push:
    branches: [main, master]
  pull_request:

name: gates

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Checked on a plain R CMD INSTALL build, which compiles with R's -DNDEBUG
  # as CRAN does. The canary runs first, so a gate that checks nothing fails.
  symbols:
    runs-on: ubuntu-latest
    name: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: The gate rejects its canary
        run: tools/check-symbols --canary
      - name: Install and inspect the shared object
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL --no-test-load -l "$RUNNER_TEMP/lib" .
          tools/check-symbols "$RUNNER_TEMP/lib/zurds/libs/zurds.so"

  standalone:
    runs-on: ubuntu-latest
    name: standalone walk
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # For zufast's headers, and for R to write the fixtures.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
      - name: Write the full fixture matrix
        run: Rscript tools/make-fixtures.R --full "$RUNNER_TEMP/full"
      - name: Build without R and walk it sanitized
        env:
          CC: clang
        run: tools/run-standalone "$RUNNER_TEMP/full"

  fuzz-canary:
    runs-on: ubuntu-latest
    name: fuzz canary
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
      - name: The target runs the seeds and crashes on its canary
        env:
          CC: clang
        run: tools/run-fuzz-canary
