# The package under UBSan, ASan, valgrind, LTO, gctorture, rchk, -fanalyzer
# and CRAN's special checks. Quick on each push to a pull request, full after
# merge; the full-ci label runs the full set on a pull request.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the four workflows it changes: quick skips the asan
# containers, valgrind and cran-special, and runs gctorture at step 500
# instead of 20. lto, rchk and analyzers take minutes either way and run on
# every push.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # Step 100 rather than 20: the suite walks every fixture in every format,
  # and at 20 the full run took over an hour at Stage 2 (r-actions docs:
  # raise step before the timeout). Every path still runs.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 100
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  # Blocking: the C is the package's own, and rchk's one finding so far (an
  # unprotected vector in zrd_extract_patch, Stage 8) was a real bug that
  # gctorture then hit. zufast is LinkingTo-only and not on CRAN, which is
  # all the rchk image installs from; drop github-packages once it is
  # (roadmap Stage 12).
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true
      github-packages: |
        pedrobtz/zufast

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
