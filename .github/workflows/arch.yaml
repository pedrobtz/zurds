# R CMD check on 32-bit and musl, where size and depth arithmetic in the
# walk behaves differently (r-actions arch.yml). Weekly, and on a pull
# request that changes this file.
on:
  schedule:
    - cron: "0 5 * * 2"
  pull_request:
    paths:
      - ".github/workflows/arch.yaml"
  workflow_dispatch:

name: arch

permissions: read-all

jobs:
  arch:
    uses: pedrobtz/r-actions/.github/workflows/arch.yml@v1
    with:
      # zufast is LinkingTo-only and not on CRAN: installed from GitHub.
      # Drop this input once it is on CRAN (roadmap Stage 12).
      install-dependencies: >-
        Rscript -e 'install.packages(c("testthat", "withr"), repos = "https://cloud.r-project.org");
        f <- tempfile(fileext = ".tar.gz");
        download.file("https://github.com/pedrobtz/zufast/archive/refs/heads/main.tar.gz", f);
        d <- tempfile(); untar(f, exdir = d);
        install.packages(list.files(d, full.names = TRUE), repos = NULL, type = "source");
        stopifnot(requireNamespace("zufast"), requireNamespace("testthat"))'
      error-on: warning
      require-tests: true
